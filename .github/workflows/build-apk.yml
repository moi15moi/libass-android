name: Build APK

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-apk:
    name: "Build release APK"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool gperf gettext nasm ninja-build pkg-config
        pipx install meson

    # Gradle 8.14 can't run on the runner's default JDK (25).
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Build native libraries
      run: python3 lib_ass/src/main/cpp/build_libass_android.py --sdk-path "$ANDROID_HOME"

    - name: Build release APK
      run: ./gradlew :app:assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: demo-libass-android
        path: app/build/outputs/apk/release/*.apk
        archive: false
        if-no-files-found: error
